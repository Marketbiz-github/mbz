name: Supabase Keep Alive Ping

on:
  schedule:
    # Run every day at 00:00 UTC (07:00 WIB)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Keep-Alive API Endpoint
        run: |
          echo "Pinging Supabase keep-alive endpoint..."
          curl -s -f "https://appshub.my.id/api/cron/keep-alive" || echo "Ping failed or domain still initializing"
